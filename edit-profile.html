<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edit Profile | JC Restaurant</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #3e2723 0%, #6d4c41 50%, #8d6e63 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    #particles-js {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      z-index: 0;
    }

    .overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(45deg, rgba(20, 10, 0, 0.7), rgba(62, 39, 35, 0.5));
      z-index: 1;
    }

    .form-card {
      z-index: 2;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
      width: 400px;
      padding: 25px 55px;
      text-align: center;
      backdrop-filter: blur(6px);
      animation: fadeIn 0.8s ease-out;
      position: relative;
      overflow: hidden;
    }

    .form-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: linear-gradient(90deg, #6d4c41, #3e2723, #6d4c41);
      background-size: 200% 100%;
      animation: shimmer 3s infinite linear;
    }

    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }

    h2 {
      color: #3e2723;
      margin-bottom: 5px;
      font-size: 1.8rem;
    }

    .subtitle {
      color: #6d4c41;
      margin-bottom: 25px;
      font-size: 0.9rem;
    }

    label {
      text-align: left;
      display: block;
      font-weight: 600;
      color: #4e342e;
      font-size: 0.9rem;
      margin-bottom: 5px;
    }

    input {
      width: 100%;
      padding: 12px 15px;
      border: 1px solid #a1887f;
      border-radius: 8px;
      margin-bottom: 10px;
      font-size: 0.9rem;
      transition: 0.3s;
      background: rgba(255, 255, 255, 0.8);
    }

    input:focus {
      border-color: #6d4c41;
      box-shadow: 0 0 6px rgba(109, 76, 65, 0.5);
      outline: none;
      background: white;
    }

    button {
      background: #6d4c41;
      color: white;
      width: 100%;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.3s;
      font-weight: 600;
      margin-top: 10px;
    }

    button:hover {
      background: #3e2723;
    }

    .success-box {
      background: #d5f4d3;
      border-left: 6px solid #1b8a00;
      padding: 12px;
      margin-bottom: 20px;
      border-radius: 6px;
      color: #145c00;
      display: none;
    }

    .error-box {
      background: #ffd3d3;
      border-left: 6px solid #d10000;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 6px;
      color: #8a0000;
      font-size: 14px;
      display: none;
    }

    /* Decorative utensils */
    .decoration {
      position: absolute;
      z-index: 1;
      opacity: 0.1;
    }

    .decoration.fork {
      top: 10%;
      left: 5%;
      font-size: 60px;
      transform: rotate(45deg);
    }

    .decoration.knife {
      bottom: 10%;
      right: 5%;
      font-size: 60px;
      transform: rotate(-45deg);
    }
  </style>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>
<body>

  <div id="particles-js"></div>
  <div class="overlay"></div>

  <div class="decoration fork">
    <i class="fas fa-utensils"></i>
  </div>

  <div class="decoration knife">
    <i class="fas fa-utensil-spoon"></i>
  </div>

  <div class="form-card">

    <h2>Edit Profile</h2>
    <p class="subtitle">Update your information</p>

    <div id="successMessage" class="success-box">
      ✔ Profile Updated Successfully!
    </div>

    <form id="editForm" action="backend/edit-profile.php" method="POST">

      <label>Full Name</label>
      <input type="text" name="name" id="name">
      <div id="nameError" class="error-box">Name cannot be empty.</div>

      <label>Email</label>
      <input type="email" name="email" id="email">
      <div id="emailError" class="error-box">Enter a valid email.</div>

      <label>Phone Number</label>
      <input type="text" name="phone" id="phone">
      <div id="phoneError" class="error-box">Phone number must be 10 digits.</div>

      <label>Password</label>
      <input type="password" name="password" id="password">
      <div id="passwordError" class="error-box">Password must be at least 6 characters.</div>

      <label>Confirm Password</label>
      <input type="password" name="confirmPassword" id="confirmPassword">
      <div id="confirmError" class="error-box">Passwords do not match.</div>

      <button type="submit">Update Profile</button>

    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>

  <script>
    // Particles background
    particlesJS("particles-js", {
      particles: {
        number: { value: 80 },
        color: { value: "#ffffff" },
        shape: { type: "circle" },
        opacity: { value: 0.3, random: true },
        size: { value: 3, random: true },
        line_linked: {
          enable: true,
          distance: 150,
          color: "#ffffff",
          opacity: 0.2,
          width: 1
        },
        move: { enable: true, speed: 2 }
      }
    });

    // Form validation (your original logic)
    document.getElementById("editForm").addEventListener("submit", function(event) {
      let valid = true;

      if (name.value.trim() === "") { nameError.style.display = "block"; valid = false; }
      else nameError.style.display = "none";

      if (!email.value.includes("@") || !email.value.includes(".")) {
        emailError.style.display = "block"; valid = false;
      } else emailError.style.display = "none";

      if (phone.value.length !== 10 || isNaN(phone.value)) {
        phoneError.style.display = "block"; valid = false;
      } else phoneError.style.display = "none";

      if (password.value.length < 6) {
        passwordError.style.display = "block"; valid = false;
      } else passwordError.style.display = "none";

      if (password.value !== confirmPassword.value) {
        confirmError.style.display = "block"; valid = false;
      } else confirmError.style.display = "none";

      if (!valid) {
        event.preventDefault();
        return;
      }

      event.preventDefault();
      successMessage.style.display = "block";
    });
  </script>

</body>
</html>
